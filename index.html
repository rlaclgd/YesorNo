<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>나랑 골프치러 갈래?💖</title>
  <style>
    :root{
      --bg: #fff0f6;
      --yes: #ff5c8a;
      --no: #d9d9d9;
      --text: #222;
    }

    body {
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: var(--text);
    }

    .container {
      text-align: center;
      position: relative;
      width: min(520px, 92vw);
      padding: 24px 16px 90px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: clamp(24px, 4.5vw, 34px);
    }

    /* 버튼들을 담는 무대(여기 안에서만 도망가게 할 거야) */
    .stage{
      position: relative;
      height: 140px;
      width: 100%;
    }

    button {
      font-size: 20px;
      padding: 12px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      position: absolute;
      transition: transform 0.18s ease;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    #yes {
      background: var(--yes);
      color: white;
      left: 42%;
      top: 60px;
      transform: translateX(-50%);
    }

    #no {
      background: var(--no);
      color: #333;
      left: 58%;
      top: 60px;
      transform: translateX(-50%);
    }

    /* 하트 눈 */
    .heart {
      position: fixed;
      top: -20px;
      font-size: 12px;          /* 쪼마난 하트 */
      opacity: 0.85;
      pointer-events: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.08));
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(var(--rot));
        opacity: 0.05;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>나랑 골프치러 갈래?🩷</h1>

    <div class="stage" id="stage">
      <button id="yes">예</button>
      <button id="no">아니오</button>
    </div>
  </div>

<script>
  const stage = document.getElementById("stage");
  const yesBtn = document.getElementById("yes");
  const noBtn  = document.getElementById("no");

  const SAFE_DISTANCE = 120;   // 절대 접근 불가 거리
  const PADDING = 10;

  // 💖 예 버튼: 가까우면 하트로 변신, 멀어지면 원래대로
const YES_TEXT = "예";
const YES_HEART = "💗";
const YES_DISTANCE = 120; // 가까워지는 기준 거리(원하면 80~150 조절)

function setYesHeart(on){
  yesBtn.textContent = on ? YES_HEART : YES_TEXT;
}

function updateYesByPointer(clientX, clientY){
  const r = yesBtn.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const d = Math.hypot(cx - clientX, cy - clientY);
  setYesHeart(d < YES_DISTANCE);
}

// 마우스/터치 모두 대응
document.addEventListener("pointermove", (e) => {
  updateYesByPointer(e.clientX, e.clientY);
}, { passive: true });

// 화면 밖으로 나가면 원상복구
document.addEventListener("pointerleave", () => setYesHeart(false));

  // 클릭 원천 차단
  noBtn.disabled = true;

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function repelFrom(clientX, clientY) {
    const stageRect = stage.getBoundingClientRect();
    const noRect = noBtn.getBoundingClientRect();

    const noCx = noRect.left + noRect.width / 2;
    const noCy = noRect.top  + noRect.height / 2;

    const dx = noCx - clientX;
    const dy = noCy - clientY;
    const dist = Math.hypot(dx, dy);

    // 이미 충분히 멀면 가만히
    if (dist >= SAFE_DISTANCE) return;

    // 👉 핵심: SAFE_DISTANCE 경계로 "강제 밀어내기"
    const push = SAFE_DISTANCE - dist + 6; // 살짝 여유(+6)
    const angle = Math.atan2(dy, dx);

    const targetCx = noCx + Math.cos(angle) * push;
    const targetCy = noCy + Math.sin(angle) * push;

    const left = clamp(
      targetCx - noRect.width / 2 - stageRect.left,
      PADDING,
      stageRect.width - noRect.width - PADDING
    );

    const top = clamp(
      targetCy - noRect.height / 2 - stageRect.top,
      PADDING,
      stageRect.height - noRect.height - PADDING
    );

    noBtn.style.left = left + "px";
    noBtn.style.top  = top  + "px";
    noBtn.style.transition = "left 0.06s linear, top 0.06s linear";
  }

  // ⭐ 문서 전체에서 지속적으로 반발
  document.addEventListener("pointermove", (e) => {
    repelFrom(e.clientX, e.clientY);
  }, { passive: true });

  // 모바일 탭 시작 순간도 차단
  document.addEventListener("pointerdown", (e) => {
    if (e.target === noBtn) {
      e.preventDefault();
      e.stopPropagation();
    }
    repelFrom(e.clientX, e.clientY);
  }, { capture: true, passive: false });

  yesBtn.addEventListener("click", () => {
    alert("꺄아 💕 사실 선택지는 하나뿐 😏");
  });

  // 💗 하트 눈
  const HEARTS = ["💗","💖","💕","💓"];
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.fontSize = 10 + Math.random() * 8 + "px";
    h.style.animationDuration = 5 + Math.random() * 3 + "s";
    h.style.setProperty("--drift", (Math.random()*80 - 40) + "px");
    h.style.setProperty("--rot", (Math.random()*200 - 100) + "deg");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }, 240);
</script>



</body>
</html>
