<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>나랑 골프치러 갈래?💖</title>
  <style>
    :root{
      --bg: #fff0f6;
      --yes: #ff5c8a;
      --no: #d9d9d9;
      --text: #222;
    }

    body {
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: var(--text);
    }

    .container {
      text-align: center;
      position: relative;
      width: min(520px, 92vw);
      padding: 24px 16px 90px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: clamp(24px, 4.5vw, 34px);
    }

    /* 버튼들을 담는 무대(여기 안에서만 도망가게 할 거야) */
    .stage{
      position: relative;
      height: 140px;
      width: 100%;
    }

    button {
      font-size: 20px;
      padding: 12px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      position: absolute;
      transition: transform 0.18s ease;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    #yes {
      background: var(--yes);
      color: white;
      left: 42%;
      top: 60px;
      transform: translateX(-50%);
    }

    #no {
      background: var(--no);
      color: #333;
      left: 58%;
      top: 60px;
      transform: translateX(-50%);
    }

    /* 하트 눈 */
    .heart {
      position: fixed;
      top: -20px;
      font-size: 12px;          /* 쪼마난 하트 */
      opacity: 0.85;
      pointer-events: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.08));
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(var(--rot));
        opacity: 0.05;
      }
    }

        #yes { transition: all 0.2s ease; }

#yes.heart-mode{
  width: 70px;
  height: 70px;
  padding: 0;
  border-radius: 0;
  transform: translateX(-50%) rotate(-45deg);
  position: absolute;
}

#yes.heart-mode::before,
#yes.heart-mode::after{
  content: "";
  position: absolute;
  width: 70px;
  height: 70px;
  background: var(--yes);
  border-radius: 50%;
}

#yes.heart-mode::before{ top: -35px; left: 0; }
#yes.heart-mode::after { top: 0; left: 35px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>나랑 골프치러 갈래?🩷</h1>

    <div class="stage" id="stage">
      <button id="yes">예</button>
      <button id="no">아니오</button>
    </div>
  </div>

<script>
  const stage = document.getElementById("stage");
  const yesBtn = document.getElementById("yes");
  const noBtn  = document.getElementById("no");

  // 👿 절대 접근 금지 거리 (모바일이면 170~220 추천)
  const SAFE_DISTANCE = 200;
  const PADDING = 10;

  // 예 버튼 하트 변신 거리
  const YES_DISTANCE = 130;

  // 👿 아니오 버튼: "눌림" 자체 원천 차단
  noBtn.style.pointerEvents = "none";

  // 마지막 포인터 좌표(마우스/손가락)
  let pointerX = window.innerWidth / 2;
  let pointerY = window.innerHeight / 2;
  let hasPointer = false;

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function setPointerFromEvent(e) {
    const t = e.touches?.[0] || e;
    if (!t) return;
    pointerX = t.clientX;
    pointerY = t.clientY;
    hasPointer = true;
  }

  // 포인터 좌표를 최대한 많이 잡아두기 (모바일/PC 모두)
  document.addEventListener("pointermove", setPointerFromEvent, { passive: true });
  document.addEventListener("mousemove", setPointerFromEvent, { passive: true });
  document.addEventListener("touchmove", setPointerFromEvent, { passive: true });

  document.addEventListener("pointerdown", setPointerFromEvent, { passive: true });
  document.addEventListener("touchstart", setPointerFromEvent, { passive: true });

  // ✅ 핵심: 매 프레임(60fps)마다 "항상" 밀어내기
  function tick() {
    if (hasPointer) {
      repelNoFromPointer();
      updateYesShape(pointerX, pointerY);
    }
    requestAnimationFrame(tick);
  }

  function repelNoFromPointer() {
    const stageRect = stage.getBoundingClientRect();
    const noRect = noBtn.getBoundingClientRect();

    const noCx = noRect.left + noRect.width / 2;
    const noCy = noRect.top  + noRect.height / 2;

    const dx = noCx - pointerX;
    const dy = noCy - pointerY;
    const dist = Math.hypot(dx, dy);

    // 안전거리 밖이면 그대로
    if (dist >= SAFE_DISTANCE) return;

    // dist가 0에 가까울 수 있으니 분모 보호
    const safeDist = Math.max(dist, 0.0001);

    // ✅ "경계 밖"으로 강제 이동: 목표 거리를 SAFE_DISTANCE로 맞춰버림
    const push = (SAFE_DISTANCE - safeDist) + 25; // +여유
    const ux = dx / safeDist;
    const uy = dy / safeDist;

    const targetCx = noCx + ux * push;
    const targetCy = noCy + uy * push;

    const left = clamp(
      targetCx - noRect.width / 2 - stageRect.left,
      PADDING,
      stageRect.width - noRect.width - PADDING
    );

    const top = clamp(
      targetCy - noRect.height / 2 - stageRect.top,
      PADDING,
      stageRect.height - noRect.height - PADDING
    );

    noBtn.style.left = left + "px";
    noBtn.style.top  = top  + "px";
    noBtn.style.transition = "left 0.05s linear, top 0.05s linear";
    noBtn.style.transform = "translateX(0)"; // 혹시 남아있을 수 있는 translate 제거
  }

  function updateYesShape(px, py) {
    const r = yesBtn.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top  + r.height / 2;
    const d = Math.hypot(cx - px, cy - py);

    if (d < YES_DISTANCE) yesBtn.classList.add("heart-mode");
    else yesBtn.classList.remove("heart-mode");
  }

  yesBtn.addEventListener("click", () => {
    alert("꺄아>_< 최고! 💕");
  });

  // 하트 눈 유지
  const HEARTS = ["💗","💖","💕","💓"];
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.fontSize = 10 + Math.random() * 8 + "px";
    h.style.animationDuration = 5 + Math.random() * 3 + "s";
    h.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
    h.style.setProperty("--rot", (Math.random() * 200 - 100) + "deg");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }, 240);

  // 시작!
  requestAnimationFrame(tick);

</script>





</body>
</html>
