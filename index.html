<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>나랑 할래?</title>
  <style>
    :root{
      --bg: #fff0f6;
      --yes: #ff5c8a;
      --no: #d9d9d9;
      --text: #222;
    }

    body {
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: var(--text);
    }

    .container {
      text-align: center;
      position: relative;
      width: min(520px, 92vw);
      padding: 24px 16px 90px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: clamp(24px, 4.5vw, 34px);
    }

    /* 버튼들을 담는 무대(여기 안에서만 도망가게 할 거야) */
    .stage{
      position: relative;
      height: 140px;
      width: 100%;
    }

    button {
      font-size: 20px;
      padding: 12px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      position: absolute;
      transition: transform 0.18s ease;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    #yes {
      background: var(--yes);
      color: white;
      left: 42%;
      top: 60px;
      transform: translateX(-50%);
    }

    #no {
      background: var(--no);
      color: #333;
      left: 58%;
      top: 60px;
      transform: translateX(-50%);
    }

    /* 하트 눈 */
    .heart {
      position: fixed;
      top: -20px;
      font-size: 12px;          /* 쪼마난 하트 */
      opacity: 0.85;
      pointer-events: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.08));
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(var(--rot));
        opacity: 0.05;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>나랑 골프치러 갈래?🩷</h1>

    <div class="stage" id="stage">
      <button id="yes">예</button>
      <button id="no">아니오</button>
    </div>
  </div>

<script>
  const stage = document.getElementById("stage");
  const yesBtn = document.getElementById("yes");
  const noBtn  = document.getElementById("no");

  // 🔥 손가락은 커서보다 크니까 거리 넉넉하게!
  const SAFE_DISTANCE = 140;   // ← 여기 올릴수록 더 안 눌림 (추천 120~180)
  const PADDING = 10;

  // 한 번에 "조금씩" 도망 (근데 가까우면 더 크게 도망)
  const STEP_MIN = 35;
  const STEP_MAX = 180;

  // 혹시라도 클릭 성공을 원천봉쇄
  noBtn.disabled = true;              // ✅ 눌려도 click 안됨
  noBtn.style.cursor = "not-allowed"; // (선택)

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function escapeFromPoint(clientX, clientY) {
    const stageRect = stage.getBoundingClientRect();
    const noRect = noBtn.getBoundingClientRect();

    const noCx = noRect.left + noRect.width / 2;
    const noCy = noRect.top  + noRect.height / 2;

    const dx = noCx - clientX;
    const dy = noCy - clientY;
    const dist = Math.hypot(dx, dy);

    // 충분히 멀면 가만히
    if (dist > SAFE_DISTANCE) return;

    // 가까울수록 더 크게 도망 (손가락이 닿기 전에 확 튐)
    const t = 1 - (dist / SAFE_DISTANCE); // 0~1
    const step = STEP_MIN + t * (STEP_MAX - STEP_MIN);

    const angle = Math.atan2(dy, dx);
    const nextCx = noCx + Math.cos(angle) * step;
    const nextCy = noCy + Math.sin(angle) * step;

    const left = clamp(
      nextCx - noRect.width / 2 - stageRect.left,
      PADDING,
      stageRect.width - noRect.width - PADDING
    );

    const top = clamp(
      nextCy - noRect.height / 2 - stageRect.top,
      PADDING,
      stageRect.height - noRect.height - PADDING
    );

    noBtn.style.left = left + "px";
    noBtn.style.top  = top  + "px";
    noBtn.style.transition = "left 0.08s ease, top 0.08s ease";
  }

  // ✅ 핵심: stage 위에서가 아니라 "문서 전체"에서 포인터 움직임 추적
  document.addEventListener("pointermove", (e) => {
    escapeFromPoint(e.clientX, e.clientY);
  }, { passive: true });

  // 모바일에서 탭 순간(눌리기 시작)에도 먼저 도망
  document.addEventListener("pointerdown", (e) => {
    // 아니오를 누르려는 순간이면 즉시 도망 + 이벤트 차단
    if (e.target === noBtn) {
      e.preventDefault();
      e.stopPropagation();
    }
    escapeFromPoint(e.clientX, e.clientY);
  }, { capture: true, passive: false });

  // 예 버튼
  yesBtn.addEventListener("click", () => {
    alert("꺄아 💕 결국 예 눌렀다 😏");
  });

  // 💗 하트 눈
  const HEARTS = ["💗","💖","💕","💓"];
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.fontSize = 10 + Math.random() * 8 + "px";
    h.style.animationDuration = 5 + Math.random() * 3 + "s";
    h.style.setProperty("--drift", (Math.random()*80 - 40) + "px");
    h.style.setProperty("--rot", (Math.random()*200 - 100) + "deg");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }, 240);
</script>


</body>
</html>
