<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>나랑 할래?</title>
  <style>
    :root{
      --bg: #fff0f6;
      --yes: #ff5c8a;
      --no: #d9d9d9;
      --text: #222;
    }

    body {
      height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: var(--text);
    }

    .container {
      text-align: center;
      position: relative;
      width: min(520px, 92vw);
      padding: 24px 16px 90px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: clamp(24px, 4.5vw, 34px);
    }

    /* 버튼들을 담는 무대(여기 안에서만 도망가게 할 거야) */
    .stage{
      position: relative;
      height: 140px;
      width: 100%;
    }

    button {
      font-size: 20px;
      padding: 12px 26px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      position: absolute;
      transition: transform 0.18s ease;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    #yes {
      background: var(--yes);
      color: white;
      left: 42%;
      top: 60px;
      transform: translateX(-50%);
    }

    #no {
      background: var(--no);
      color: #333;
      left: 58%;
      top: 60px;
      transform: translateX(-50%);
    }

    /* 하트 눈 */
    .heart {
      position: fixed;
      top: -20px;
      font-size: 12px;          /* 쪼마난 하트 */
      opacity: 0.85;
      pointer-events: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.08));
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(var(--rot));
        opacity: 0.05;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>나랑 골프치러 갈래?🩷</h1>

    <div class="stage" id="stage">
      <button id="yes">예</button>
      <button id="no">아니오</button>
    </div>
  </div>

  <script>
  const stage = document.getElementById("stage");
  const yesBtn = document.getElementById("yes");
  const noBtn  = document.getElementById("no");

  const SAFE_DISTANCE = 30;   // 마우스랑 최소 거리 (붙는 거 방지)
  const STEP_MIN = 40;        // 한 번에 최소 이동 거리
  const STEP_MAX = 120;       // 한 번에 최대 이동 거리
  const PADDING = 10;

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function moveNoButtonFromCursor(e) {
    const stageRect = stage.getBoundingClientRect();
    const noRect = noBtn.getBoundingClientRect();

    const cursorX = e.clientX;
    const cursorY = e.clientY;

    const noCx = noRect.left + noRect.width / 2;
    const noCy = noRect.top  + noRect.height / 2;

    const dx = noCx - cursorX;
    const dy = noCy - cursorY;
    const distance = Math.hypot(dx, dy);

    // 너무 가까워졌을 때만 도망
    if (distance > SAFE_DISTANCE) return;

    // 현재 위치 기준으로 방향 계산
    const angle = Math.atan2(dy, dx);
    const step = STEP_MIN + Math.random() * (STEP_MAX - STEP_MIN);

    let nextCx = noCx + Math.cos(angle) * step;
    let nextCy = noCy + Math.sin(angle) * step;

    // stage 안으로 제한
    const left = clamp(
      nextCx - noRect.width / 2 - stageRect.left,
      PADDING,
      stageRect.width - noRect.width - PADDING
    );

    const top = clamp(
      nextCy - noRect.height / 2 - stageRect.top,
      PADDING,
      stageRect.height - noRect.height - PADDING
    );

    noBtn.style.left = left + "px";
    noBtn.style.top  = top  + "px";
    noBtn.style.transition = "left 0.12s ease, top 0.12s ease";
  }

  stage.addEventListener("mousemove", moveNoButtonFromCursor);
  stage.addEventListener("touchmove", (e) => {
    moveNoButtonFromCursor(e.touches[0]);
  }, { passive: true });

  yesBtn.addEventListener("click", () => {
    alert("꺄아 최고 💕");
  });

  // 💗 하트 눈
  const HEARTS = ["💗","💖","💕","💓"];
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.fontSize = 10 + Math.random() * 8 + "px";
    h.style.animationDuration = 5 + Math.random() * 3 + "s";
    h.style.setProperty("--drift", (Math.random()*80 - 40) + "px");
    h.style.setProperty("--rot", (Math.random()*200 - 100) + "deg");
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }, 240);
</script>

</body>
</html>
